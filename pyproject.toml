[project]
name = "manga-translate"
version = "0.1.0"
description = "Japanese-to-Korean manga translation window using a local LLM and BallonsTranslator"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "natsort>=8.4",
    "pywebview>=5.3",
]

[project.gui-scripts]
manga-translate = "manga_translate.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "psutil>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manga_translate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
